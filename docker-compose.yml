# 足迹 - Docker Compose配置

services:
  # 应用服务
  app:
    build: .
    container_name: footprint-app
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - DB_TYPE=sqlite
      - DB_NAME=/app/data/footprint.db
      - STORAGE_PROVIDER=local
      - AMAP_KEY=${AMAP_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-footprint_prod_secret_fixed_key_change_me}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: footprint-nginx
    ports:
      - "80:80"
      # 如需启用 HTTPS：请将证书放入 nginx/ssl/ 并取消下方注释：
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
